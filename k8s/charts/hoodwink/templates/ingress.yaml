{{- if .Values.ingress.enabled }}
# Opcional: nesta VM o TLS é terminado pelo nginx do host
# (k8s/scripts/edge-nginx.sh); em produção o Ingress fica desligado.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hoodwink.fullname" . }}
  labels:
    {{- include "hoodwink.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hoodwink.fullname" . }}-web
                port:
                  name: http
{{- end }}
