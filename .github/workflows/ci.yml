name: CI

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

# PR novo cancela a execução anterior; push em production nunca é cancelado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay-wasm:
    name: Replay — WASM por versão e manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Instala brotli
        run: sudo apt-get update && sudo apt-get install -y brotli

      - name: Build do WASM + manifest
        run: make -C server replay-wasm

      - name: Confere existência e sha256 dos artefatos
        run: |
          test -s client/web/src/replay/manifest.gen.ts
          test -s client/web/public/replay/wasm_exec.js
          ls client/web/public/replay/replay-v*.wasm >/dev/null
          ls client/web/public/replay/replay-v*.wasm.br >/dev/null
          make -C server replay-wasm-check

      # O job web baixa estes arquivos: assim o bundle do CI usa exatamente o
      # .wasm gerado neste commit, sem depender de artefato commitado.
      - uses: actions/upload-artifact@v4
        with:
          name: replay-wasm
          path: |
            client/web/public/replay
            client/web/src/replay/manifest.gen.ts
          if-no-files-found: error

  web:
    name: Web — testes e build
    needs: replay-wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/web/package-lock.json

      - name: Baixa o WASM do replay gerado neste commit
        uses: actions/download-artifact@v4
        with:
          name: replay-wasm
          path: client/web

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build de produção
        run: npm run build

  server:
    name: Server — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server/backend, server/gameServer]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

  replay:
    name: Replay — formato, runner e e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Testes do formato/runner
        run: cd server/replay && go vet ./... && go test ./...

      - name: E2E (200 partidas + golden)
        run: cd server/replay/e2e && go vet ./... && go test ./...

  engine-check:
    name: Engine — versão e fecho do motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Checa versão e fecho do motor
        run: make engine-check
        working-directory: server

  # Build NATIVO na VM (arm64) + import no containerd, como no Summus: a rede
  # de pods do flannel não tem egress nesta VM Oracle, então não há registry.
  #
  # Secrets/vars do repositório:
  #   vars.VM_HOST | secrets.VM_USER | secrets.VM_SSH_KEY
  # Segredos da aplicação: environment production do GitHub; o job cria/atualiza
  # direto o Secret hoodwink-secrets no cluster, sem arquivo na VM.
  deploy:
    name: Deploy na VM (Helm)
    needs: [web, server, replay, engine-check]
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Build + deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          PG_PASS: ${{ secrets.PG_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GAME_JWT_SECRET: ${{ secrets.GAME_JWT_SECRET }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          TICKET_PRIVATE_KEY: ${{ secrets.TICKET_PRIVATE_KEY }}
          TICKET_PUBLIC_KEY: ${{ secrets.TICKET_PUBLIC_KEY }}
          REPLAY_SIGNING_KEY: ${{ secrets.REPLAY_SIGNING_KEY }}
          REPLAY_PUBLIC_KEY_HEX: ${{ secrets.REPLAY_PUBLIC_KEY_HEX }}
        with:
          host: ${{ vars.VM_HOST || '144.33.18.156' }}
          username: ${{ secrets.VM_USER || 'ubuntu' }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 40m
          envs: GITHUB_SHA,PG_PASS,JWT_SECRET,GAME_JWT_SECRET,BACKEND_API_KEY,REDIS_PASSWORD,TICKET_PRIVATE_KEY,TICKET_PUBLIC_KEY,REPLAY_SIGNING_KEY,REPLAY_PUBLIC_KEY_HEX
          script: |
            set -euo pipefail
            export KUBECONFIG="$HOME/.kube/config"

            NS=hoodwink
            RELEASE=hoodwink
            REPO="$HOME/Hoodwink"
            PREFIX=ghcr.io/matheusgoncalves540
            SHA="${GITHUB_SHA:?GITHUB_SHA ausente}"

            if [ ! -d "$REPO/.git" ]; then
              echo "==> Clonando o repositório na VM"
              git clone https://github.com/MatheusGoncalves540/Hoodwink.git "$REPO"
            fi

            echo "==> Atualizando $REPO para $SHA"
            cd "$REPO"
            git fetch origin --prune
            git checkout -f "$SHA"
            SHORT=$(git rev-parse --short HEAD)

            echo "==> Validando segredos do GitHub"
            required="PG_PASS JWT_SECRET GAME_JWT_SECRET BACKEND_API_KEY REDIS_PASSWORD TICKET_PRIVATE_KEY TICKET_PUBLIC_KEY REPLAY_SIGNING_KEY REPLAY_PUBLIC_KEY_HEX"
            for name in $required; do
              if [ -z "${!name:-}" ]; then
                echo "::error::Secret $name ausente no environment production do GitHub."
                exit 1
              fi
            done

            # Legado: o deploy antigo lia este arquivo. Hoje a fonte é o Secret do cluster.
            rm -f k8s/.env.production

            echo "==> Build das imagens (nativo arm64) $SHORT"

            # BuildKit: cache de módulos/compilação Go entre deploys e `nginx -t` no build.
            sudo DOCKER_BUILDKIT=1 docker build -f server/backend/Dockerfile -t "$PREFIX/hoodwink-backend:$SHORT" server
            sudo DOCKER_BUILDKIT=1 docker build -f server/gameServer/Dockerfile -t "$PREFIX/hoodwink-gameserver:$SHORT" server
            sudo DOCKER_BUILDKIT=1 docker build \
              --build-arg "VITE_REPLAY_PUBLIC_KEY=${REPLAY_PUBLIC_KEY_HEX:-}" \
              -t "$PREFIX/hoodwink-web:$SHORT" client/web

            echo "==> Import no containerd do k3s"
            for image in backend gameserver web; do
              ref="$PREFIX/hoodwink-$image:$SHORT"
              sudo docker save "$ref" -o "/tmp/hoodwink-$image.tar"
              sudo k3s ctr images import "/tmp/hoodwink-$image.tar"
              sudo rm -f "/tmp/hoodwink-$image.tar"
            done

            echo "==> Namespace + Secret"
            kubectl apply -f k8s/namespace.yaml
            kubectl -n "$NS" create secret generic hoodwink-secrets \
              --from-literal=PG_PASS="$PG_PASS" \
              --from-literal=JWT_SECRET="$JWT_SECRET" \
              --from-literal=GAME_JWT_SECRET="$GAME_JWT_SECRET" \
              --from-literal=BACKEND_API_KEY="$BACKEND_API_KEY" \
              --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
              --from-literal=TICKET_PRIVATE_KEY="$TICKET_PRIVATE_KEY" \
              --from-literal=TICKET_PUBLIC_KEY="$TICKET_PUBLIC_KEY" \
              --from-literal=REPLAY_SIGNING_KEY="$REPLAY_SIGNING_KEY" \
              --from-literal=REPLAY_PUBLIC_KEY_HEX="$REPLAY_PUBLIC_KEY_HEX" \
              --dry-run=client -o yaml | kubectl apply -f -

            echo "==> Helm upgrade --install --atomic"
            CHART=k8s/charts/hoodwink
            if ! helm upgrade --install "$RELEASE" "$CHART" -n "$NS" \
                  -f "$CHART/values.production.yaml" \
                  --set imageTag="$SHORT" \
                  --wait --atomic --timeout 10m; then
              echo "::error::Deploy falhou — diagnóstico:"
              kubectl -n "$NS" get pods -o wide || true
              kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -n 30 || true
              kubectl -n "$NS" logs -l app.kubernetes.io/instance="$RELEASE" --tail=120 --prefix || true
              exit 1
            fi

            echo "==> Rollout OK"
            for component in backend gameserver web; do
              kubectl -n "$NS" rollout status "deploy/$RELEASE-$component" --timeout=180s
            done
            kubectl -n "$NS" get pods

            echo "==> Smoke test"
            bash k8s/scripts/smoke-test.sh

            # Evita acúmulo de camadas órfãs no disco da VM.
            sudo docker image prune -f >/dev/null
