# Este arquivo é incluído dentro do bloco `http` (conf.d). O MIME de wasm é
# definido nos locations abaixo (a imagem já traz `application/wasm`).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSP do app. `wasm-unsafe-eval` é o mínimo para instanciar o motor de replay;
    # o wasm em si é conferido por sha256 contra o manifest do bundle (T12/T13).
    # Google Identity Services precisa de accounts.google.com/apis.google.com.
    #
    # Atenção: `add_header` não é herdado por location que declara outro
    # add_header, então o bloco `= /index.html` repete esta linha.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://apis.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com" always;
    add_header X-Content-Type-Options "nosniff" always;

    # SPA: qualquer rota desconhecida cai no index (o app usa query string).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://apis.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Motor de replay: um .wasm por versão, já comprimido com brotli e com hash
    # no nome (replay-v<N>-<sha>.wasm.br). O browser descomprime pelo
    # Content-Encoding; o app nunca usa instantiateStreaming direto da rede.
    location ~ "^/replay/replay-v[0-9]+-[0-9a-f]{8}\.wasm\.br$" {
        default_type application/wasm;
        gzip off;
        add_header Content-Encoding br always;
        add_header Vary "Accept-Encoding" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Qualquer outro .br (nome sem hash) nunca é imutável: precisa revalidar.
    location ~* \.wasm\.br$ {
        default_type application/octet-stream;
        gzip off;
        add_header Content-Encoding br always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # .wasm sem compressão (se algum dia for servido) — MIME correto.
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    # wasm_exec.js da toolchain Go: nome sem hash, conferido pelo sha256 do
    # manifest; cache curto para pegar atualização de toolchain.
    location = /replay/wasm_exec.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
